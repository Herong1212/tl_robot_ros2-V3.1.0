tl_teleop_node:
    # 表示这些配置属于这个 ROS 2 节点
    ros__parameters:
        # ========== 轴数配置（6轴机械臂：TCB605 / TCB610 系列）==========
        arm_axis_mode: 6

        # ========== 位置控制参数 ==========
        pos_scale: 0.5 # 位置缩放系数（VR位移 1m → 末端移动 0.5m）
        max_linear_speed: 0.10 # 逆解目标平移速度上限（m/s）
        max_angular_speed: 0.65 # 逆解目标旋转速度上限（rad/s）
        pos_deadzone: 0.005 # 位置死区（m），小于此值的位移被忽略
        max_pos_delta_m: 0.3 # 单步最大位置增量（m），防止异常跳变

        # ========== 奇异点防护参数 ==========
        joint_jump_threshold: 30.0 # 关节指令跳变阈值（度），超过此值拒绝执行
        singular_angle: 160.0 # 奇异点判定角度（度），J5/J6 超过此角自动减速
        singular_scale: 0.2 # 奇异点区域速度缩放系数

        # 6轴关节硬限位（度）：J1~J5 ±180°，J6 ±170°
        # 扁平数组，每两个数一组：[min1, max1, min2, max2, ...]
        # joint_limits:
        #     [
        #         -180.0,
        #         180.0,
        #         -180.0,
        #         180.0,
        #         -180.0,
        #         180.0,
        #         -180.0,
        #         180.0,
        #         -180.0,
        #         180.0,
        #         -170.0,
        #         170.0,
        #     ]
        joint_limits:
            [
                -179.0,
                179.0,
                -135.0,
                135.0,
                -58.0,
                237.0,
                -179.0,
                179.0,
                -220.0,
                38.0,
                -179.0,
                179.0,
            ]

        # ========== ServoJ 初始化参数 ==========
        servo_speed: 15.0 # 控制器速度档位（%），目标轨迹使用下方独立约束
        servo_vmax: 30.0 # ServoJ 最大速度（度/秒）
        servo_amax: 200.0 # ServoJ 最大加速度（度/秒²）
        servo_jmax: 1500.0 # ServoJ 最大加加速度（度/秒³）
